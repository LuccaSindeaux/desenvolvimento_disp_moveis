<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta charset="utf-8">
	<title>Biblioteca Animate</title>
	<link
		rel="stylesheet"
		href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  	/>
</head>
<body>
	<div class="container">
		<h2 class="animate__animated animate__bounce animate__delay-2s">Animando minha página!</h2>
		<p class="animate__animated animate__shakeY animate__infinite" >Remexendo muito!</p>
		<p class="animate__animated animate__shakeX" >Eu sou outra frase para animar!</p>
	</div>
</body>
</html>
